name: musicgram
description: A one-handed music player UI for Telegram and local music.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audio_service: ^0.18.19
  audioplayers: ^6.8.1
  country_picker: ^2.0.28
  file_picker: ^13.3.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.4.3
  path_provider: ^2.1.6
  upnp_client: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/record.png
    - assets/images/musicgram-logo.png
